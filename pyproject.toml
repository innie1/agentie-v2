[project]
name = "agentie-v2"
version = "0.1.0"
description = "Python-first agent platform built with FastAPI and the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "openai-agents>=0.6.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
