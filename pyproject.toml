[project]
name = "agentie-v2"
version = "1.1.0"
description = "Python-first agent platform built with FastAPI and the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ddgs>=9.5.0",
  "fastapi>=0.115.0",
  "fastembed>=0.7.0",
  "openai-agents>=0.6.0",
  "openpyxl>=3.1.0",
  "pillow>=10.0.0",
  "psutil>=5.9.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "python-pptx>=1.0.0",
  "pyyaml>=6.0.0",
  "reportlab>=4.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["agentie*"]
exclude = ["workspace*"]

[tool.ruff]
line-length = 100
