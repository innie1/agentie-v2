<div class="agentie-app" id="agentieApp">
  <aside class="sidebar" id="leftSidebar">
    <div class="side-top"><button class="icon-btn new-agent" id="newAgentButton" type="button" title="Create agent">＋</button></div>
    <div class="search-box"><span>⌕</span><input id="agentSearch" type="search" placeholder="Search" autocomplete="off"></div>
    <div class="agent-list" id="agentList"></div>
    <div class="side-spacer"></div>
    <div class="workspace-account" id="workspaceAccount"><span class="workspace-avatar">A</span><span>Agentie workspace</span></div>
    <select id="agentType" aria-hidden="true" tabindex="-1"><option value="general">General</option><option value="research">Research</option><option value="coding">Coding</option><option value="manager">Manager</option><option value="github">GitHub</option></select>
  </aside>

  <main class="chat-shell">
    <header class="chat-head">
      <button class="agent-dot" id="sidebarToggle" type="button" title="Toggle sidebar"></button>
      <strong id="activeAgentName">New Agent</strong>
      <div class="window-tools">
        <button id="screenToggle" type="button" title="Agent screen">▣</button>
        <button id="focusToggle" type="button" title="Focus mode">—</button>
        <button id="appFullscreen" type="button" title="Fullscreen">□</button>
      </div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer-wrap">
      <div class="composer">
        <button class="composer-plus" id="composerPlus" type="button" title="Attach or add">＋</button>
        <textarea id="messageInput" rows="1" placeholder="Message Agentie..."></textarea>
        <button class="mic-button" id="micButton" type="button" title="Speak">●</button>
        <button class="send-hidden" id="sendButton" type="button">Send</button>
      </div>
    </div>
  </main>

  <aside class="context-panel" id="contextPanel">
    <div class="context-head">
      <button class="context-back" id="contextBack" type="button" title="Back">‹</button>
      <strong id="contextTitle">Screen</strong>
      <div class="context-actions"><button id="settingsButton" type="button" title="Agent settings">⚙</button><button id="contextCollapse" type="button" title="Collapse panel">»</button></div>
    </div>
    <div class="context-body">
      <section class="context-view active" id="screenView">
        <div class="screen-slot" id="agentieComputerMount">
          <div class="screen-empty" id="screenEmpty"><div class="screen-icon">▣</div><div id="screenLabel">Agent screen</div><button id="startComputerButton" type="button">Start computer</button></div>
        </div>
        <div class="routine-empty"><p>Routines are recurring tasks this agent runs on a schedule.</p><button id="createRoutineButton" type="button">Create Routine</button></div>
      </section>
      <section class="context-view" id="settingsView">
        <div class="settings-avatar" id="settingsAvatar">A</div>
        <label>Name<input id="agentNameField" type="text"></label>
        <label>Title<input id="agentTitleField" type="text" placeholder="Describe what this agent does"></label>
        <label>Description<textarea id="agentDescriptionField" rows="4" placeholder="What this agent is for"></textarea></label>
        <label>Instructions<textarea id="agentPromptField" rows="8" placeholder="Generated agent instructions"></textarea></label>
        <button class="primary-button" id="saveAgentSettings" type="button">Save agent</button>
      </section>
    </div>
  </aside>
</div>

<style>
:root{color-scheme:dark;--bg:#080808;--panel:#111;--panel2:#191919;--soft:#222;--soft2:#2b2b2b;--line:#292929;--text:#f5f5f5;--muted:#8d8d8d;--purple:#8247e5;--accent:#fff;--accent-text:#050505}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}.agentie-app{height:100vh;display:grid;grid-template-columns:340px minmax(440px,1fr) 420px;background:var(--bg)}
.sidebar{position:relative;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);background:#101010;padding:14px 16px 16px}.side-top{height:48px;display:flex;justify-content:flex-end;align-items:center}.icon-btn{border:0;background:transparent;color:#bbb;font-size:27px;cursor:pointer}.search-box{height:44px;display:flex;align-items:center;gap:8px;padding:0 11px;border:1px solid #343434;border-radius:11px;background:#242424;color:#999}.search-box input{width:100%;border:0;outline:0;background:transparent;color:#eee;font-size:16px}.agent-list{display:grid;gap:6px;margin-top:16px;overflow:auto}.agent-item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 10px;border-radius:13px;cursor:pointer;min-width:0}.agent-item:hover,.agent-item.active{background:#303030}.agent-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#060606}.agent-copy{min-width:0}.agent-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-sub{margin-top:2px;color:#999;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-meta{color:#858585;font-size:12px}.side-spacer{flex:1}.workspace-account{display:flex;align-items:center;gap:10px;font-weight:650;padding:8px 4px}.workspace-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#1f7780;color:white}.sidebar select{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.chat-shell{position:relative;min-width:0;background:#050505}.chat-head{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px}.agent-dot{width:25px;height:25px;border:0;border-radius:50%;background:var(--purple);cursor:pointer}.chat-head strong{font-size:16px}.window-tools{margin-left:auto;display:flex;height:100%}.window-tools button,.context-actions button,.context-back{width:54px;border:0;background:transparent;color:#ddd;cursor:pointer;font-size:17px}.window-tools button:hover,.context-actions button:hover,.context-back:hover{background:#181818}.messages{height:calc(100vh - 72px);overflow:auto;padding:32px 22px 150px;scroll-behavior:smooth}.message-date{text-align:center;color:#929292;font-size:13px;margin:2px 0 24px}.user-row,.assistant-row{display:flex;margin:7px 0}.user-row{justify-content:flex-end}.bubble{max-width:min(760px,85%);font-size:15px;line-height:1.45;padding:10px 15px;border-radius:21px;white-space:pre-wrap}.bubble.assistant{background:#2b2b2b}.bubble.user{background:#3a3a3a}.assistant-row .card-wrap{max-width:min(800px,95%)}.working{display:inline-flex;align-items:center;gap:8px;color:#999;font-size:13px}.working-dots{display:inline-flex;gap:4px}.working-dots span{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1s infinite ease-in-out}.working-dots span:nth-child(2){animation-delay:.15s}.working-dots span:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
.creator-card{width:min(820px,92%);margin-top:10px;padding:16px;border-radius:22px;background:#292929;border:1px solid #333}.creator-head{display:flex;align-items:center;font-weight:750;font-size:16px;margin-bottom:12px}.creator-head button{margin-left:auto;border:0;background:transparent;color:#aaa;font-size:20px;cursor:pointer}.creator-options{overflow:hidden;border:1px solid #474747;border-radius:12px}.creator-option{display:flex;gap:12px;align-items:center;padding:13px 12px;border-bottom:1px solid #444;cursor:pointer}.creator-option:last-child{border-bottom:0}.creator-option:hover{background:#343434}.creator-key{width:25px;height:25px;border-radius:6px;background:#4a4a4a;color:#aaa;display:grid;place-items:center;font-size:12px}.creator-label{font-size:15px}.creator-input{width:100%;margin-top:12px;padding:12px;border-radius:9px;border:1px solid #303030;background:#050505;color:white;outline:0}.creator-note{font-size:12px;color:#999;margin-top:10px;line-height:1.4}
.composer-wrap{position:absolute;left:0;right:0;bottom:0;padding:30px 20px 18px;background:linear-gradient(transparent,#050505 34%)}.composer{height:58px;display:flex;align-items:center;gap:8px;border:1px solid #444;border-radius:30px;background:#303030;padding:6px 8px}.composer-plus{width:39px;height:39px;border:0;border-radius:50%;background:#494949;color:#aaa;font-size:26px;cursor:pointer}.composer textarea{flex:1;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:#f5f5f5;font-size:16px;padding:8px}.mic-button{width:39px;height:39px;border:0;border-radius:50%;background:white;color:black;cursor:pointer;font-size:10px}.mic-button.listening{background:#8247e5;color:white;box-shadow:0 0 0 6px rgba(130,71,229,.2)}.send-hidden{display:none}
.context-panel{min-width:0;border-left:1px solid var(--line);background:#060606}.context-head{height:72px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.context-head strong{font-size:15px}.context-actions{margin-left:auto;display:flex}.context-body{height:calc(100vh - 72px);overflow:auto;padding:0 20px}.context-view{display:none}.context-view.active{display:block}.screen-slot{margin-top:26px;min-height:240px;border-radius:9px;background:#1d1d1d;overflow:hidden}.screen-empty{height:240px;display:grid;place-items:center;align-content:center;gap:10px;color:#858585}.screen-icon{font-size:24px}.screen-empty button,.routine-empty button,.primary-button{border:1px solid #3c3c3c;border-radius:11px;padding:10px 14px;background:#202020;color:white;cursor:pointer}.routine-empty{text-align:center;color:#737373;margin:190px auto 0;max-width:280px;font-size:13px;line-height:1.45}.settings-avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:var(--purple);font-size:24px;font-weight:800;margin:36px auto 40px}.settings-view{}.context-view label{display:block;color:#9d9d9d;font-size:13px;margin:0 0 14px}.context-view input,.context-view textarea{display:block;width:100%;margin-top:7px;border:1px solid #343434;border-radius:10px;background:#070707;color:#eee;padding:11px;outline:0;resize:vertical}.primary-button{width:100%;margin:4px 0 30px;background:#f1f1f1;color:#070707;font-weight:700}
.agentie-app.left-collapsed{grid-template-columns:90px minmax(440px,1fr) 420px}.left-collapsed .sidebar{padding-left:11px;padding-right:11px}.left-collapsed .search-box,.left-collapsed .agent-copy,.left-collapsed .agent-meta,.left-collapsed .workspace-account span:last-child,.left-collapsed .side-top{display:none}.left-collapsed .agent-item{grid-template-columns:1fr;padding:8px}.left-collapsed .agent-avatar{margin:auto}.agentie-app.context-collapsed{grid-template-columns:340px minmax(440px,1fr) 70px}.context-collapsed .context-body,.context-collapsed .context-head strong,.context-collapsed .context-back{display:none}.context-collapsed .context-actions{margin:auto;flex-direction:column}.agentie-app.left-collapsed.context-collapsed{grid-template-columns:90px minmax(440px,1fr) 70px}.focus-mode{grid-template-columns:90px 1fr 0!important}.focus-mode .context-panel{display:none}.focus-mode .sidebar{padding-left:11px;padding-right:11px}.focus-mode .search-box,.focus-mode .agent-copy,.focus-mode .agent-meta,.focus-mode .workspace-account span:last-child,.focus-mode .side-top{display:none}
@media(max-width:1050px){.agentie-app{grid-template-columns:90px 1fr}.sidebar{padding-left:11px;padding-right:11px}.search-box,.agent-copy,.agent-meta,.workspace-account span:last-child,.side-top{display:none}.agent-item{grid-template-columns:1fr;padding:8px}.agent-avatar{margin:auto}.context-panel{display:none}}@media(max-width:680px){.agentie-app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding-left:14px;padding-right:14px}.chat-head{padding:0 14px}}
</style>

<script>
(()=>{
  const STORAGE='agentie.ui.agents.v1',CURRENT='agentie.ui.currentAgent.v1';
  const app=document.getElementById('agentieApp'),messages=document.getElementById('messages'),input=document.getElementById('messageInput'),sendButton=document.getElementById('sendButton'),agentType=document.getElementById('agentType');
  const listEl=document.getElementById('agentList'),nameEl=document.getElementById('activeAgentName'),search=document.getElementById('agentSearch');
  const palette=['#8247e5','#087cea','#00a99d','#f18c2e','#e85276','#36a269','#d6b62b'];
  let agents=loadAgents(),currentId=localStorage.getItem(CURRENT)||'',onboarding=null;
  if(currentId&&!agents.some(a=>a.id===currentId))currentId='';
  const esc=s=>{const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML};
  function loadAgents(){try{const v=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(v)?v:[]}catch(_){return[]}}
  function saveAgents(){localStorage.setItem(STORAGE,JSON.stringify(agents));if(currentId)localStorage.setItem(CURRENT,currentId)}
  function current(){return agents.find(a=>a.id===currentId)||null}
  function colorFor(id){let n=0;for(const ch of id)n=(n+ch.charCodeAt(0)*17)%997;return palette[n%palette.length]}
  function baseFor(personality){const p=String(personality||'').toLowerCase();if(/research|critic|verify/.test(p))return'research';if(/builder|coder|engineer|data/.test(p))return'coding';if(/planner|manager|coordinator|operator/.test(p))return'manager';if(/github/.test(p))return'github';return'general'}
  function buildPrompt(purpose,personality,name,description=''){
    return `You are ${name}, a persistent Agentie agent. Your primary purpose is: ${purpose}. Personality and working style: ${personality}. ${description?`Additional context: ${description}. `:''}Be proactive but grounded. Ask concise follow-up questions only when information is genuinely missing. Use the tools available to your base Agentie role when they improve accuracy or are required to complete the task. Keep track of the user's goal, make progress visible, and never claim an action succeeded unless it actually did. Preserve Agentie safety, approval, and tool-use rules.`;
  }
  function roleName(a){return `profile_${String(a.id).replace(/[^a-z0-9_-]/gi,'').slice(0,30)}`.toLowerCase()}
  async function syncRole(a){if(!a)return;const command=`Configure agent ${a.base} role ${roleName(a)} base ${a.base} instruction ${a.prompt}`;try{await fetch('/agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:command,agent_type:a.base,session_id:`agent-config:${a.id}`})})}catch(_){}}
  function setAgent(id){currentId=id;const a=current();if(a){agentType.value=a.base||'general';nameEl.textContent=a.name;onboarding=null}else{nameEl.textContent='New Agent'}saveAgents();renderList();renderConversation();renderSettings();renderScreenState()}
  function renderList(){const q=search.value.trim().toLowerCase();listEl.innerHTML='';agents.filter(a=>!q||a.name.toLowerCase().includes(q)||(a.title||'').toLowerCase().includes(q)).forEach(a=>{const el=document.createElement('div');el.className='agent-item'+(a.id===currentId?' active':'');el.innerHTML=`<div class="agent-avatar" style="background:${colorFor(a.id)}">${esc((a.name||'A').slice(0,1).toUpperCase())}</div><div class="agent-copy"><div class="agent-name">${esc(a.name)}</div><div class="agent-sub">${esc(a.lastPreview||a.title||a.purpose||'')}</div></div><div class="agent-meta">${esc(a.updatedLabel||'')}</div>`;el.onclick=()=>setAgent(a.id);listEl.appendChild(el)})}
  function addDate(){const d=document.createElement('div');d.className='message-date';d.textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});messages.appendChild(d)}
  function bubble(role,text){const r=document.createElement('div');r.className=role==='user'?'user-row':'assistant-row';r.innerHTML=`<div class="bubble ${role==='user'?'user':'assistant'}">${esc(text)}</div>`;messages.appendChild(r);return r}
  function addWorking(){const r=document.createElement('div');r.className='assistant-row';r.innerHTML='<div class="working"><span>Agentie is working</span><span class="working-dots"><span></span><span></span><span></span></span></div>';messages.appendChild(r);messages.scrollTop=messages.scrollHeight;return r}
  function addAssistant(message,card,store=true){const r=document.createElement('div');r.className='assistant-row';const box=document.createElement('div');if(message){const b=document.createElement('div');b.className='bubble assistant';b.textContent=message;box.appendChild(b)}if(card&&typeof window.renderCard==='function')box.appendChild(window.renderCard(card,message));r.appendChild(box);messages.appendChild(r);if(store){const a=current();if(a){a.messages=a.messages||[];a.messages.push({role:'assistant',text:message||'',card:null});saveAgents()}}messages.scrollTop=messages.scrollHeight;return r}window.addAssistant=addAssistant;
  function addUser(text,store=true){bubble('user',text);if(store){const a=current();if(a){a.messages=a.messages||[];a.messages.push({role:'user',text});a.lastPreview=text;a.updatedAt=new Date().toISOString();saveAgents();renderList()}}messages.scrollTop=messages.scrollHeight}
  function renderConversation(){messages.innerHTML='';addDate();const a=current();if(!a){startOnboarding();return}(a.messages||[]).forEach(m=>bubble(m.role,m.text));if(!(a.messages||[]).length){bubble('assistant',`I'm ${a.name}. ${a.title||a.purpose}`)}}
  function startOnboarding(){onboarding={step:'purpose',purpose:'',personality:'',name:''};bubble('assistant',"Hey. I’m here and ready whenever you are.");bubble('assistant','Tell me what you want this agent to take ownership of, and I’ll shape it with you.');renderCreatorPurpose()}
  function creatorShell(title){const r=document.createElement('div');r.className='assistant-row';const c=document.createElement('div');c.className='creator-card';c.innerHTML=`<div class="creator-head"><span>${esc(title)}</span><button type="button">×</button></div>`;c.querySelector('button').onclick=()=>{onboarding=null;c.remove()};r.appendChild(c);messages.appendChild(r);return c}
  function optionRow(parent,key,label,fn){const d=document.createElement('div');d.className='creator-option';d.innerHTML=`<span class="creator-key">${esc(key)}</span><span class="creator-label">${esc(label)}</span>`;d.onclick=fn;parent.appendChild(d)}
  function renderCreatorPurpose(){onboarding.step='purpose';const c=creatorShell('What should I help with first?'),opts=document.createElement('div');opts.className='creator-options';[['A','Work / business'],['B','Personal life'],['C','A mix of both'],['D',"I'll tell you"]].forEach(([k,v])=>optionRow(opts,k,v,()=>choosePurpose(v)));c.appendChild(opts);const own=document.createElement('input');own.className='creator-input';own.placeholder='Type your own answer';own.onkeydown=e=>{if(e.key==='Enter'&&own.value.trim())choosePurpose(own.value.trim())};c.appendChild(own)}
  function choosePurpose(v){onboarding.purpose=v;messages.lastElementChild?.remove();renderCreatorPersonality()}
  function renderCreatorPersonality(){onboarding.step='personality';bubble('assistant','How should this agent think and work?');const c=creatorShell('Choose a personality'),opts=document.createElement('div');opts.className='creator-options';[['A','Focused operator'],['B','Rigorous researcher'],['C','Builder / engineer'],['D','Planner / coordinator'],['E','Skeptical critic']].forEach(([k,v])=>optionRow(opts,k,v,()=>choosePersonality(v)));c.appendChild(opts);const own=document.createElement('input');own.className='creator-input';own.placeholder='Describe a custom personality';own.onkeydown=e=>{if(e.key==='Enter'&&own.value.trim())choosePersonality(own.value.trim())};c.appendChild(own)}
  function choosePersonality(v){onboarding.personality=v;messages.lastElementChild?.remove();renderCreatorName()}
  function renderCreatorName(){onboarding.step='name';bubble('assistant','Last thing: what should I call this agent?');const c=creatorShell('Name your agent');const own=document.createElement('input');own.className='creator-input';own.placeholder='Agent name';own.autofocus=true;own.onkeydown=e=>{if(e.key==='Enter'&&own.value.trim())finishOnboarding(own.value.trim())};c.appendChild(own);const note=document.createElement('div');note.className='creator-note';note.textContent='Agentie will turn your answers into the real runtime instructions for this agent. You can edit them later in Settings.';c.appendChild(note);setTimeout(()=>own.focus(),20)}
  async function finishOnboarding(name){const id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)).replace(/-/g,'').slice(0,12);const base=baseFor(onboarding.personality);const purpose=onboarding.purpose,personality=onboarding.personality;const profile={id,name,purpose,personality,base,title:purpose,description:'',prompt:buildPrompt(purpose,personality,name),messages:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};agents.unshift(profile);currentId=id;onboarding=null;saveAgents();await syncRole(profile);setAgent(id);addAssistant(`${name} is ready. I’ve created its runtime personality and instructions from what you told me.`)}
  async function sendMessage(override,opts={}){let text=(override??input.value).trim();if(!text)return;if(onboarding){if(onboarding.step==='purpose'){choosePurpose(text);input.value='';return}if(onboarding.step==='personality'){choosePersonality(text);input.value='';return}if(onboarding.step==='name'){await finishOnboarding(text);input.value='';return}}const a=current();if(!a){startOnboarding();return}input.value='';resizeInput();if(!opts.silentUser)addUser(text);const working=opts.noWorking?null:addWorking();try{await syncRole(a);const response=await fetch('/agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,agent_type:a.base||'general',session_id:`agent:${a.id}`})});const data=await response.json();if(working)working.remove();if(!response.ok)throw new Error(data.detail||'Agent request failed');if(!opts.silentAssistant)addAssistant(data.message||data.result||'',data.card||null);return data}catch(error){if(working)working.remove();if(!opts.silentAssistant)addAssistant(`Error: ${error.message||error}`);throw error}}
  window.sendMessage=sendMessage;
  function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'}input.addEventListener('input',resizeInput);sendButton.onclick=()=>sendMessage();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  document.getElementById('newAgentButton').onclick=()=>{currentId='';localStorage.removeItem(CURRENT);nameEl.textContent='New Agent';renderList();renderConversation();renderSettings();renderScreenState()};search.oninput=renderList;
  document.getElementById('sidebarToggle').onclick=()=>app.classList.toggle('left-collapsed');document.getElementById('contextCollapse').onclick=()=>app.classList.toggle('context-collapsed');document.getElementById('focusToggle').onclick=()=>app.classList.toggle('focus-mode');document.getElementById('appFullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.getElementById('screenToggle').onclick=()=>{app.classList.remove('context-collapsed');showContext('screen')};document.getElementById('settingsButton').onclick=()=>showContext('settings');document.getElementById('contextBack').onclick=()=>showContext('screen');
  function showContext(kind){document.querySelectorAll('.context-view').forEach(x=>x.classList.remove('active'));document.getElementById(kind==='settings'?'settingsView':'screenView').classList.add('active');document.getElementById('contextTitle').textContent=kind==='settings'?'Settings':'Screen'}
  function renderSettings(){const a=current(),fields=['agentNameField','agentTitleField','agentDescriptionField','agentPromptField'];if(!a){fields.forEach(id=>document.getElementById(id).value='');document.getElementById('settingsAvatar').textContent='A';return}document.getElementById('agentNameField').value=a.name||'';document.getElementById('agentTitleField').value=a.title||'';document.getElementById('agentDescriptionField').value=a.description||'';document.getElementById('agentPromptField').value=a.prompt||'';document.getElementById('settingsAvatar').textContent=(a.name||'A')[0].toUpperCase();document.getElementById('settingsAvatar').style.background=colorFor(a.id)}
  document.getElementById('saveAgentSettings').onclick=async()=>{const a=current();if(!a)return;a.name=document.getElementById('agentNameField').value.trim()||a.name;a.title=document.getElementById('agentTitleField').value.trim();a.description=document.getElementById('agentDescriptionField').value.trim();a.prompt=document.getElementById('agentPromptField').value.trim()||buildPrompt(a.purpose,a.personality,a.name,a.description);a.updatedAt=new Date().toISOString();saveAgents();await syncRole(a);setAgent(a.id);showContext('screen')};
  function renderScreenState(){const a=current();document.getElementById('screenLabel').textContent=a?`${a.name}'s screen`:'Agent screen';document.getElementById('startComputerButton').disabled=!a}
  document.getElementById('startComputerButton').onclick=()=>{if(current())sendMessage('Show desktop')};document.getElementById('createRoutineButton').onclick=()=>{if(!current())return;input.value='Create a routine for this agent: ';input.focus();resizeInput()};
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById('micButton');let recognition=null;if(SpeechRecognition){recognition=new SpeechRecognition();recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>mic.classList.add('listening');recognition.onend=()=>mic.classList.remove('listening');recognition.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++)final+=e.results[i][0].transcript;if(final){input.value=final;resizeInput();if(e.results[e.results.length-1].isFinal)sendMessage()}};mic.onclick=()=>{try{recognition.start()}catch(_){}}}else{mic.onclick=()=>input.focus();mic.title='Voice input is not available in this browser'}
  renderList();if(currentId)setAgent(currentId);else{renderConversation();renderSettings();renderScreenState()}
})();
</script>
