name: Agentie Regression

on:
  push:
    branches:
      - main11
      - feature/useful-tools-regression
  pull_request:
    branches:
      - main11

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Agentie
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*regression.py'
